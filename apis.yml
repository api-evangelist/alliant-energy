description: >-
  Alliant Energy Corporation (NASDAQ: LNT) is a regulated investor-owned public
  utility holding company that provides electric and natural gas service to
  approximately 1 million electric and 430,000 natural gas retail customers in
  Iowa and Wisconsin. The company operates through two regulated utility
  subsidiaries: Interstate Power and Light (IPL) in Iowa and Wisconsin Power
  and Light (WPL) in Wisconsin. Alliant Energy is investing significantly in
  renewable energy, with wind and solar generation expansion across its service
  territory. The company supports data centers and large energy users with
  dedicated service programs in Iowa and Wisconsin. Alliant Energy participates
  in the Green Button initiative for standardized customer energy usage data
  access, providing customers with secure access to their historical energy
  consumption data. As a regulated utility, Alliant Energy does not maintain a
  public developer API program beyond Green Button data access for customers.
